<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>focus.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0e0e0e;
  --bg2: #161616;
  --bg3: #1f1f1f;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0ede6;
  --muted: #888;
  --accent: #c8f56a;
  --accent2: #6af5c8;
  --red: #f5846a;
  --mono: 'DM Mono', monospace;
  --serif: 'DM Serif Display', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; }
body { min-height: 100vh; display: flex; flex-direction: column; }

/* NAV */
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 2rem; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 10;
}
.logo { font-family: var(--serif); font-size: 1.5rem; letter-spacing: -0.5px; color: var(--accent); }
.nav-tabs { display: flex; gap: 4px; }
.nav-tab {
  padding: 6px 16px; border: 1px solid transparent; border-radius: 20px;
  background: transparent; color: var(--muted); font-family: var(--mono);
  font-size: 12px; cursor: pointer; transition: all .2s; letter-spacing: .5px;
}
.nav-tab:hover { color: var(--text); border-color: var(--border2); }
.nav-tab.active { color: var(--bg); background: var(--text); border-color: var(--text); }

/* PAGES */
.page { display: none; flex: 1; }
.page.active { display: flex; }

/* FOCUS PAGE */
#page-focus {
  display: none; flex-direction: row; min-height: calc(100vh - 61px);
}
#page-focus.active { display: flex; }

.left-panel {
  width: 55%; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 3rem 2rem; position: relative;
  border-right: 1px solid var(--border);
}

.phase-badge {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 2.5rem; display: flex; align-items: center; gap: 8px;
}
.phase-badge .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
  transition: background .4s;
}
.phase-badge.focus .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.phase-badge.break .dot { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }

.ring-wrap {
  position: relative; width: 260px; height: 260px; margin-bottom: 2.5rem;
}
.ring-wrap svg { transform: rotate(-90deg); overflow: visible; }
.ring-bg { fill: none; stroke: var(--bg3); stroke-width: 3; }
.ring-track { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ring-center {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center;
}
.ring-time {
  font-family: var(--serif); font-size: 3.5rem; color: var(--text);
  letter-spacing: -2px; line-height: 1;
}
.ring-sub { font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-top: 6px; }

.controls { display: flex; gap: 10px; }
.btn {
  padding: 10px 22px; border-radius: 4px; font-family: var(--mono); font-size: 12px;
  letter-spacing: .5px; cursor: pointer; transition: all .15s; border: 1px solid;
}
.btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
.btn-primary:hover { background: #d4ff75; }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border2); }
.btn-ghost:hover { border-color: var(--text); }
.btn-red { background: transparent; color: var(--red); border-color: rgba(245,132,106,.3); }
.btn-red:hover { background: rgba(245,132,106,.08); }
.btn-break { background: var(--accent2); color: var(--bg); border-color: var(--accent2); font-weight: 500; }
.btn-break:hover { background: #7affd5; }

/* Break chooser */
.break-panel {
  margin-top: 2rem; padding: 1.5rem; border: 1px solid var(--border);
  border-radius: 8px; width: 100%; max-width: 320px; display: none;
}
.break-panel.visible { display: block; }
.break-title { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 1rem; }
.break-options { display: flex; gap: 8px; margin-bottom: 1.25rem; }
.ratio-btn {
  flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 4px;
  background: transparent; color: var(--muted); font-family: var(--mono);
  font-size: 11px; cursor: pointer; transition: all .15s; text-align: center;
}
.ratio-btn:hover { border-color: var(--border2); color: var(--text); }
.ratio-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(106,245,200,.06); }
.ratio-btn .ratio-big { font-family: var(--serif); font-size: 1.6rem; display: block; color: inherit; line-height: 1; margin-bottom: 3px; }
.ratio-btn .ratio-label { font-size: 10px; }
.break-calc { font-size: 13px; color: var(--muted); margin-bottom: 1rem; }
.break-calc span { color: var(--accent2); font-weight: 500; }
.break-actions { display: flex; flex-direction: column; gap: 8px; }

/* RIGHT PANEL */
.right-panel {
  width: 45%; padding: 2rem; display: flex; flex-direction: column;
  overflow-y: auto; max-height: calc(100vh - 61px);
}
.panel-section { margin-bottom: 2rem; }
.panel-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 1rem; }

.obj-input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
.obj-input {
  flex: 1; padding: 10px 12px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text); font-family: var(--mono); font-size: 13px;
  outline: none; transition: border-color .15s;
}
.obj-input:focus { border-color: var(--border2); }
.obj-input::placeholder { color: var(--muted); }
.btn-add {
  padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text); font-size: 18px; cursor: pointer;
  transition: all .15s; line-height: 1;
}
.btn-add:hover { border-color: var(--border2); background: var(--bg3); }

.obj-list { display: flex; flex-direction: column; gap: 2px; }
.obj-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px;
  border-radius: 4px; transition: background .1s;
}
.obj-item:hover { background: var(--bg2); }
.obj-check {
  width: 18px; height: 18px; border-radius: 3px; border: 1px solid var(--border2);
  background: transparent; cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; transition: all .15s; font-size: 11px;
}
.obj-check.done { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.obj-text { flex: 1; font-size: 13px; color: var(--text); line-height: 1.4; }
.obj-text.done { text-decoration: line-through; color: var(--muted); }
.obj-del {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 16px; padding: 2px 4px; opacity: 0; transition: opacity .15s;
}
.obj-item:hover .obj-del { opacity: 1; }
.obj-del:hover { color: var(--red); }
.obj-empty { font-size: 12px; color: var(--muted); padding: 8px 10px; font-style: italic; }

/* session summary in right panel */
.session-info {
  border: 1px solid var(--border); border-radius: 6px; padding: 1rem;
  font-size: 12px; color: var(--muted); display: none;
}
.session-info.visible { display: block; }
.session-info .si-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
.session-info .si-row:last-child { border-bottom: none; }
.session-info .si-val { color: var(--text); }

/* HISTORY PAGE */
#page-history {
  display: none; flex-direction: column; padding: 2.5rem 2rem;
  max-width: 800px; width: 100%; margin: 0 auto;
}
#page-history.active { display: flex; }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 2.5rem; }
.stat-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
  padding: 1.25rem; text-align: center;
}
.stat-n { font-family: var(--serif); font-size: 2.5rem; color: var(--accent); line-height: 1; }
.stat-l { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); margin-top: 6px; }

.hist-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 1rem; }
.hist-list { display: flex; flex-direction: column; gap: 8px; }
.hist-item {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
  padding: 1rem 1.25rem; transition: border-color .15s;
}
.hist-item:hover { border-color: var(--border2); }
.hist-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.hist-date { font-size: 13px; color: var(--text); }
.hist-dur { font-size: 11px; color: var(--muted); }
.hist-dur span { color: var(--accent2); }
.hist-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.htag {
  font-size: 11px; padding: 3px 9px; border-radius: 12px;
  border: 1px solid var(--border); color: var(--muted);
}
.htag.done { border-color: rgba(200,245,106,.25); color: var(--accent); }
.hist-empty { text-align: center; padding: 4rem; color: var(--muted); font-size: 13px; }

/* Pulse animation */
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.pulsing .dot { animation: pulse 2s infinite; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
</style>
</head>
<body>

<nav>
  <div class="logo">focus.</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('focus')">timer</button>
    <button class="nav-tab" onclick="showPage('history')">historial</button>
  </div>
</nav>

<!-- FOCUS PAGE -->
<div id="page-focus" class="page active">
  <div class="left-panel">
    <div id="phase-badge" class="phase-badge">
      <span class="dot"></span>
      <span id="phase-text">listo</span>
    </div>

    <div class="ring-wrap">
      <svg width="260" height="260" viewBox="0 0 260 260">
        <circle class="ring-bg" cx="130" cy="130" r="118"/>
        <circle id="ring-track" class="ring-track" cx="130" cy="130" r="118"
          stroke="#c8f56a" stroke-dasharray="741.1" stroke-dashoffset="741.1"/>
      </svg>
      <div class="ring-center">
        <div id="ring-time" class="ring-time">00:00</div>
        <div id="ring-sub" class="ring-sub">sesión</div>
      </div>
    </div>

    <div id="controls" class="controls">
      <button id="btn-start" class="btn btn-primary" onclick="startFocus()">iniciar</button>
    </div>

    <div id="break-panel" class="break-panel">
      <div class="break-title">elegir descanso</div>
      <div class="break-options">
        <button class="ratio-btn active" id="r4" onclick="setRatio(4)">
          <span class="ratio-big">÷4</span>
          <span class="ratio-label">más corto</span>
        </button>
        <button class="ratio-btn" id="r3" onclick="setRatio(3)">
          <span class="ratio-big">÷3</span>
          <span class="ratio-label">más largo</span>
        </button>
      </div>
      <div id="break-calc" class="break-calc">descanso: <span id="break-mins">—</span></div>
      <div class="break-actions">
        <button class="btn btn-break" onclick="startBreak()">☕ empezar descanso</button>
        <button class="btn btn-ghost" onclick="skipBreak()">→ nueva sesión ya</button>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="panel-section">
      <div class="panel-label">objetivos de esta sesión</div>
      <div class="obj-input-row">
        <input class="obj-input" id="obj-input" type="text" placeholder="agregar objetivo y enter..."/>
        <button class="btn-add" onclick="addObj()" title="agregar">+</button>
      </div>
      <div id="obj-list" class="obj-list">
        <div class="obj-empty">sin objetivos — agregá uno arriba</div>
      </div>
    </div>

    <div class="panel-section">
      <div id="session-info" class="session-info">
        <div class="si-row"><span>sesiones hoy</span><span class="si-val" id="si-today">—</span></div>
        <div class="si-row"><span>última sesión</span><span class="si-val" id="si-last">—</span></div>
        <div class="si-row"><span>total hoy</span><span class="si-val" id="si-total">—</span></div>
      </div>
    </div>
  </div>
</div>

<!-- HISTORY PAGE -->
<div id="page-history" class="page">
  <div class="stats-row">
    <div class="stat-box"><div class="stat-n" id="st-sessions">0</div><div class="stat-l">sesiones</div></div>
    <div class="stat-box"><div class="stat-n" id="st-hours">0h</div><div class="stat-l">horas de focus</div></div>
    <div class="stat-box"><div class="stat-n" id="st-tasks">0</div><div class="stat-l">tareas hechas</div></div>
  </div>
  <div class="hist-label">registro de sesiones</div>
  <div id="hist-list" class="hist-list">
    <div class="hist-empty">todavía no hay sesiones registradas.<br/>¡arrancá tu primer bloque de focus!</div>
  </div>
</div>

<script>
const CIRCUM = 2 * Math.PI * 118;
let phase = 'idle';
let elapsed = 0;
let ratio = 4;
let objectives = [];
let history = [];
let interval = null;
let breakRemaining = 0;
let breakTotal = 0;

function showPage(p) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  event.currentTarget.classList.add('active');
  if (p === 'history') renderHistory();
}

function fmt(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function setRing(progress, color) {
  const track = document.getElementById('ring-track');
  track.setAttribute('stroke', color || '#c8f56a');
  track.style.strokeDashoffset = CIRCUM * (1 - Math.min(Math.max(progress,0),1));
}

function setPhase(p, label) {
  const badge = document.getElementById('phase-badge');
  badge.className = 'phase-badge ' + p;
  if (p === 'focus') badge.classList.add('pulsing');
  document.getElementById('phase-text').textContent = label;
}

function startFocus() {
  clearInterval(interval);
  phase = 'focus';
  elapsed = 0;
  setPhase('focus', 'en focus');
  setRing(0, '#c8f56a');
  document.getElementById('ring-sub').textContent = 'sesión';
  document.getElementById('break-panel').classList.remove('visible');
  document.getElementById('controls').innerHTML = `
    <button class="btn btn-ghost" onclick="pauseFocus()" id="btn-pause">pausar</button>
    <button class="btn btn-red" onclick="stopFocus()">terminar</button>
  `;
  interval = setInterval(() => {
    elapsed++;
    document.getElementById('ring-time').textContent = fmt(elapsed);
    setRing((elapsed % 3600) / 3600, '#c8f56a');
  }, 1000);
}

function pauseFocus() {
  const btn = document.getElementById('btn-pause');
  if (interval) {
    clearInterval(interval); interval = null;
    btn.textContent = 'continuar';
    btn.onclick = continueFocus;
    setPhase('idle', 'pausado');
  }
}
function continueFocus() {
  const btn = document.getElementById('btn-pause');
  btn.textContent = 'pausar';
  btn.onclick = pauseFocus;
  setPhase('focus', 'en focus');
  interval = setInterval(() => {
    elapsed++;
    document.getElementById('ring-time').textContent = fmt(elapsed);
    setRing((elapsed % 3600) / 3600, '#c8f56a');
  }, 1000);
}

function stopFocus() {
  clearInterval(interval); interval = null;
  phase = 'choosing';
  document.getElementById('controls').innerHTML = '';
  setPhase('idle', 'sesión terminada');
  setRing(1, '#c8f56a');
  updateBreakCalc();
  document.getElementById('break-panel').classList.add('visible');
}

function setRatio(r) {
  ratio = r;
  document.getElementById('r3').classList.toggle('active', r===3);
  document.getElementById('r4').classList.toggle('active', r===4);
  updateBreakCalc();
}

function updateBreakCalc() {
  const secs = Math.round(elapsed / ratio);
  const mins = Math.round(secs / 60);
  const display = mins < 1 ? '~1 min' : mins + ' min';
  document.getElementById('break-mins').textContent = display + ' (÷' + ratio + ')';
  breakTotal = secs;
  breakRemaining = secs;
}

function startBreak() {
  saveSession();
  document.getElementById('break-panel').classList.remove('visible');
  phase = 'break';
  setPhase('break', 'descansando');
  setRing(1, '#6af5c8');
  document.getElementById('ring-time').textContent = fmt(breakRemaining);
  document.getElementById('ring-sub').textContent = 'descanso';
  document.getElementById('controls').innerHTML = `
    <button class="btn btn-primary" onclick="endBreak()">→ ya terminé el descanso</button>
  `;
  clearInterval(interval);
  interval = setInterval(() => {
    breakRemaining--;
    document.getElementById('ring-time').textContent = fmt(Math.max(breakRemaining,0));
    setRing(Math.max(breakRemaining,0) / breakTotal, '#6af5c8');
    if (breakRemaining <= 0) {
      clearInterval(interval); interval = null;
      document.getElementById('ring-sub').textContent = '¡listo!';
      setPhase('idle', '¡a arrancar!');
    }
  }, 1000);
}

function endBreak() {
  clearInterval(interval); interval = null;
  resetForNewSession();
  startFocus();
}

function skipBreak() {
  saveSession();
  document.getElementById('break-panel').classList.remove('visible');
  resetForNewSession();
  startFocus();
}

function resetForNewSession() {
  elapsed = 0;
  objectives = objectives.map(o => ({...o, done: false}));
  renderObjs();
  updateSessionInfo();
}

function saveSession() {
  const now = new Date();
  history.unshift({
    ts: now,
    date: now.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'short'}),
    time: now.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'}),
    duration: elapsed,
    ratio,
    objectives: objectives.map(o => ({...o}))
  });
  updateSessionInfo();
}

function updateSessionInfo() {
  if (history.length === 0) return;
  const si = document.getElementById('session-info');
  si.classList.add('visible');
  const today = new Date().toDateString();
  const todaySessions = history.filter(h => h.ts.toDateString() === today);
  const todayTotal = todaySessions.reduce((a,s) => a+s.duration, 0);
  document.getElementById('si-today').textContent = todaySessions.length;
  document.getElementById('si-last').textContent = fmt(history[0].duration);
  document.getElementById('si-total').textContent = fmt(todayTotal);
}

function addObj() {
  const inp = document.getElementById('obj-input');
  const txt = inp.value.trim();
  if (!txt) return;
  objectives.push({ id: Date.now(), text: txt, done: false });
  inp.value = '';
  renderObjs();
}

document.getElementById('obj-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addObj();
});

function toggleObj(id) {
  const o = objectives.find(x => x.id===id);
  if (o) o.done = !o.done;
  renderObjs();
}
function delObj(id) {
  objectives = objectives.filter(x => x.id!==id);
  renderObjs();
}

function renderObjs() {
  const list = document.getElementById('obj-list');
  if (!objectives.length) {
    list.innerHTML = '<div class="obj-empty">sin objetivos — agregá uno arriba</div>';
    return;
  }
  list.innerHTML = objectives.map(o => `
    <div class="obj-item">
      <div class="obj-check ${o.done?'done':''}" onclick="toggleObj(${o.id})">
        ${o.done ? '✓' : ''}
      </div>
      <span class="obj-text ${o.done?'done':''}">${escHtml(o.text)}</span>
      <button class="obj-del" onclick="delObj(${o.id})" title="eliminar">×</button>
    </div>
  `).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderHistory() {
  const list = document.getElementById('hist-list');
  if (!history.length) {
    list.innerHTML = '<div class="hist-empty">todavía no hay sesiones registradas.<br/>¡arrancá tu primer bloque de focus!</div>';
    document.getElementById('st-sessions').textContent = '0';
    document.getElementById('st-hours').textContent = '0h';
    document.getElementById('st-tasks').textContent = '0';
    return;
  }
  const totalSecs = history.reduce((a,s)=>a+s.duration,0);
  const totalHours = (totalSecs/3600).toFixed(1);
  const totalDone = history.reduce((a,s)=>a+s.objectives.filter(o=>o.done).length,0);
  document.getElementById('st-sessions').textContent = history.length;
  document.getElementById('st-hours').textContent = totalHours + 'h';
  document.getElementById('st-tasks').textContent = totalDone;

  list.innerHTML = history.map(s => {
    const breakMins = Math.round(s.duration/s.ratio/60);
    const tags = s.objectives.length
      ? s.objectives.map(o=>`<span class="htag ${o.done?'done':''}">${o.done?'✓ ':''}${escHtml(o.text)}</span>`).join('')
      : '<span class="htag">sin objetivos</span>';
    return `<div class="hist-item">
      <div class="hist-top">
        <span class="hist-date">${s.date} — ${s.time}</span>
        <span class="hist-dur">${fmt(s.duration)} → descanso <span>${breakMins}min</span> (÷${s.ratio})</span>
      </div>
      <div class="hist-tags">${tags}</div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
